%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters (from PiCameraW/Calibration/camera_params.json)
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV)
Camera.fx: 494.33132261894696
Camera.fy: 494.877317052068
Camera.cx: 387.40950633046873
Camera.cy: 216.2153226981435

# Distortion model: radtan (k1, k2, p1, p2)
# Distortion coefficients: [-0.06359654008049867, 0.14249544509166515, 0.000679605809842952, -0.0001403527170031257]
Camera.k1: -0.06359654008049867
Camera.k2: 0.14249544509166515
Camera.p1: 0.000679605809842952
Camera.p2: -0.0001403527170031257
Camera.k3: 0.0

# Camera resolution
Camera.width: 768
Camera.height: 432

# Camera frames per second 
Camera.fps: 15.0

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# T_ci:  (imu0 to cam0): 
# [[-0.03293591  0.99919643 -0.02284137  0.00571465]
#  [ 0.00751991  0.02310087  0.99970486  0.0051677 ]
#  [ 0.99942918  0.03275442 -0.00827471 -0.10193996]
#  [ 0.          0.          0.          1.        ]]

# T_ic:  (cam0 to imu0): 
# [[-0.03293591  0.00751991  0.99942918  0.10203112]
#  [ 0.99919643  0.02310087  0.03275442 -0.00249046]
#  [-0.02284137  0.99970486 -0.00827471 -0.00587917]
#  [ 0.          0.          0.          1.        ]]

Tbc: # opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.03293591,  0.99919643, -0.02284137,  0.00571465,
          0.00751991,  0.02310087,  0.99970486,  0.0051677,
          0.99942918,  0.03275442, -0.00827471, -0.10193996,
          0.0,         0.0,         0.0,         1.0]
   # data: [-0.03293591,  0.00751991,  0.99942918,  0.10203112,
   #         0.99919643,  0.02310087,  0.03275442, -0.00249046,
   #        -0.02284137,  0.99970486, -0.00827471, -0.00587917,
   #         0.0          ,  0.0          ,  0.0          ,  1.0       ]
   # data: [ 0.99174276, -0.00502564, -0.12814458,  0.06253107,
   #        -0.04257062, -0.95547274, -0.29199243,  0.21296293,
   #        -0.12097120,  0.29503657, -0.94779713,  0.21058876,
   #         0.0,         0.0,         0.0,         1.0]


# # IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 0.0016 # rad/s^0.5 
IMU.NoiseAcc: 0.028 # m/s^1.5
IMU.GyroWalk: 0.00022 # rad/s^1.5
IMU.AccWalk: 0.0086 # m/s^2.5
IMU.Frequency: 200


#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 6000 # Tested with 1250

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 12

# ORB Extractor: Fast threshold (lower = more features, helps init on Pi camera)
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
ORBextractor.iniThFAST: 3
ORBextractor.minThFAST: 2

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5 # -1.8
Viewer.ViewpointF: 500
